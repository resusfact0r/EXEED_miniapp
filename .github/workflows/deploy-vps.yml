name: Verify and publish VPS release

on:
  push:
    branches: [main, feat/web-visual-catalog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exeed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test the shipped frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm run build
          npm run test:web
          npm run test:bundle
      - name: Browser QA, mobile layouts and accessibility
        run: npm run test:browser
      - name: Save browser QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          path: |
            work/qa/*.json
            work/qa/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Install and test backend
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run prisma:generate
          npm run test:web
      - name: Check deployment scripts and package the release
        run: |
          for script in server/deploy/autodeploy/*.sh; do bash -n "$script"; done
          node --test tests/autodeploy.test.mjs
          node scripts/package-release.mjs work/release
      - uses: actions/upload-artifact@v4
        with:
          name: vps-release-${{ github.sha }}
          path: |
            work/release/release.tar.gz
            work/release/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vps-release-${{ github.sha }}
          path: release
      - name: Publish the verified immutable artifact for the VPS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          tag="deploy-${RELEASE_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Verified release already exists: $tag"
          else
            gh release create "$tag" \
              --target "$RELEASE_SHA" \
              --prerelease \
              --title "Deploy ${RELEASE_BRANCH} @ ${RELEASE_SHA:0:7}" \
              --notes "Built and verified by GitHub Actions. The VPS updater installs this artifact only when its configured branch points to this commit." \
              release/release.tar.gz release/release.tar.gz.sha256
          fi
          echo "Published $tag. An activated VPS updater will pick it up automatically." >> "$GITHUB_STEP_SUMMARY"
