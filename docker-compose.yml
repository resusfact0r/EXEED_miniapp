services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tg_miniapp
    ports:
      - "5433:5432"
    volumes:
      - tg_miniapp_pgdata:/var/lib/postgresql/data

volumes:
  tg_miniapp_pgdata:
